<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00B4FF"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6C3CE1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0D1117" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Distributed AI Architecture</text>

  <!-- Orchestrator Node -->
  <rect x="280" y="55" width="240" height="60" rx="10" fill="#161B22" stroke="#00B4FF" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="82" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Orchestrator</text>
  <text x="400" y="100" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Task Distribution &amp; Coordination</text>

  <!-- Arrows from Orchestrator to Workers -->
  <line x1="330" y1="115" x2="120" y2="195" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="115" x2="310" y2="195" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="115" x2="490" y2="195" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="115" x2="680" y2="195" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Worker 1 -->
  <rect x="40" y="200" width="170" height="70" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="125" y="230" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Worker 1</text>
  <text x="125" y="250" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">GPU 0 · Model Shard</text>

  <!-- Worker 2 -->
  <rect x="230" y="200" width="170" height="70" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="315" y="230" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Worker 2</text>
  <text x="315" y="250" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">GPU 1 · Model Shard</text>

  <!-- Worker 3 -->
  <rect x="420" y="200" width="170" height="70" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="505" y="230" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Worker 3</text>
  <text x="505" y="250" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">GPU 2 · Model Shard</text>

  <!-- Worker 4 -->
  <rect x="610" y="200" width="170" height="70" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="695" y="230" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Worker 4</text>
  <text x="695" y="250" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">GPU 3 · Model Shard</text>

  <!-- Communication lines between workers -->
  <line x1="210" y1="235" x2="230" y2="235" stroke="#00B4FF" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="400" y1="235" x2="420" y2="235" stroke="#00B4FF" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="590" y1="235" x2="610" y2="235" stroke="#00B4FF" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Arrows from Workers to Gradient AllReduce -->
  <line x1="125" y1="270" x2="300" y2="400" stroke="#6C3CE1" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <line x1="315" y1="270" x2="350" y2="400" stroke="#6C3CE1" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <line x1="505" y1="270" x2="450" y2="400" stroke="#6C3CE1" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <line x1="695" y1="270" x2="500" y2="400" stroke="#6C3CE1" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>

  <!-- Gradient AllReduce -->
  <rect x="240" y="405" width="320" height="65" rx="10" fill="#161B22" stroke="#6C3CE1" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="432" text-anchor="middle" fill="#6C3CE1" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Gradient AllReduce</text>
  <text x="400" y="452" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Synchronized Gradient Aggregation</text>

  <!-- Parameter Server box -->
  <rect x="240" y="510" width="320" height="60" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="400" y="537" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Parameter Server</text>
  <text x="400" y="555" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Model State Management</text>

  <!-- Arrow from AllReduce to Parameter Server -->
  <line x1="400" y1="470" x2="400" y2="510" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feedback arrows from Parameter Server back to Workers -->
  <line x1="240" y1="530" x2="125" y2="270" stroke="#6C3CE1" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)" opacity="0.6"/>
  <line x1="315" y1="510" x2="315" y2="270" stroke="#6C3CE1" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)" opacity="0.6"/>
  <line x1="505" y1="510" x2="505" y2="270" stroke="#6C3CE1" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)" opacity="0.6"/>
  <line x1="560" y1="530" x2="695" y2="270" stroke="#6C3CE1" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)" opacity="0.6"/>

  <!-- Legend -->
  <rect x="20" y="520" width="180" height="65" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="30" y="540" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Legend:</text>
  <line x1="30" y1="555" x2="70" y2="555" stroke="#00B4FF" stroke-width="2"/>
  <text x="78" y="559" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Task Dispatch</text>
  <line x1="30" y1="572" x2="70" y2="572" stroke="#6C3CE1" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="78" y="576" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Gradient Sync</text>
</svg>