<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00B4FF"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6C3CE1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#0D1117" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="20" font-weight="bold">LLM Token Flow Pipeline</text>

  <!-- Row 1: Input Text → Tokenizer → Token IDs → Embedding -->
  <!-- Input Text -->
  <rect x="20" y="70" width="120" height="60" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="80" y="97" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Input Text</text>
  <text x="80" y="115" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">"Hello world"</text>

  <!-- Arrow -->
  <line x1="140" y1="100" x2="165" y2="100" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tokenizer -->
  <rect x="175" y="70" width="120" height="60" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="235" y="97" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Tokenizer</text>
  <text x="235" y="115" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">BPE / SentencePiece</text>

  <!-- Arrow -->
  <line x1="295" y1="100" x2="320" y2="100" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Token IDs -->
  <rect x="330" y="70" width="120" height="60" rx="8" fill="#161B22" stroke="#6C3CE1" stroke-width="1.5"/>
  <text x="390" y="97" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Token IDs</text>
  <text x="390" y="115" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">[15496, 995]</text>

  <!-- Arrow -->
  <line x1="450" y1="100" x2="475" y2="100" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Embedding -->
  <rect x="485" y="70" width="120" height="60" rx="8" fill="#161B22" stroke="#6C3CE1" stroke-width="1.5"/>
  <text x="545" y="97" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Embedding</text>
  <text x="545" y="115" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">+ Positional Enc.</text>

  <!-- Arrow wrapping to row 2 -->
  <line x1="605" y1="100" x2="630" y2="100" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Transformer Layers (large box spanning row 2) -->
  <rect x="640" y="55" width="240" height="110" rx="10" fill="#161B22" stroke="#00B4FF" stroke-width="2" filter="url(#glow)"/>
  <text x="760" y="82" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="13" font-weight="bold">Transformer Layers</text>

  <!-- Sub-blocks inside Transformer -->
  <rect x="660" y="95" width="95" height="30" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="707" y="115" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Self-Attention</text>

  <rect x="765" y="95" width="95" height="30" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="812" y="115" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">FFN</text>

  <text x="760" y="148" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">×N layers · LayerNorm · Residual</text>

  <!-- Arrow from Transformer down to row 2 -->
  <line x1="760" y1="165" x2="760" y2="200" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2: Output Tokens → Detokenizer → Output Text -->
  <!-- Output Tokens -->
  <rect x="640" y="210" width="150" height="60" rx="8" fill="#161B22" stroke="#6C3CE1" stroke-width="1.5"/>
  <text x="715" y="237" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Output Tokens</text>
  <text x="715" y="255" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Logits → ArgMax / Sample</text>

  <!-- Arrow -->
  <line x1="640" y1="240" x2="555" y2="240" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Detokenizer -->
  <rect x="415" y="210" width="140" height="60" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="485" y="237" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Detokenizer</text>
  <text x="485" y="255" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">ID → Text Mapping</text>

  <!-- Arrow -->
  <line x1="415" y1="240" x2="360" y2="240" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output Text -->
  <rect x="220" y="210" width="140" height="60" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="2" filter="url(#glow)"/>
  <text x="290" y="237" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Output Text</text>
  <text x="290" y="255" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Generated Response</text>

  <!-- Data flow description boxes -->
  <rect x="30" y="310" width="250" height="70" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="45" y="333" fill="#00B4FF" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Encoding Phase</text>
  <text x="45" y="350" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Text → Tokens → IDs → Vectors</text>
  <text x="45" y="365" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Deterministic mapping pipeline</text>

  <rect x="310" y="310" width="250" height="70" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="325" y="333" fill="#6C3CE1" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Processing Phase</text>
  <text x="325" y="350" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Contextual representation via</text>
  <text x="325" y="365" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">multi-head self-attention layers</text>

  <rect x="590" y="310" width="250" height="70" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="605" y="333" fill="#00B4FF" font-family="Arial,sans-serif" font-size="11" font-weight="bold">Decoding Phase</text>
  <text x="605" y="350" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Logits → Sampling → Tokens</text>
  <text x="605" y="365" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">→ Decoded text output</text>

  <!-- Decorative line separating flow from description -->
  <line x1="30" y1="295" x2="870" y2="295" stroke="#30363D" stroke-width="1" stroke-dasharray="4,4"/>
</svg>