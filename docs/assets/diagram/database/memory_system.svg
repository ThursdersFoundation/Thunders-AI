<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00B4FF"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6C3CE1"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F0883E"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="#0D1117" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="20" font-weight="bold">AI Memory System Architecture</text>

  <!-- ===== Four Memory Types (Top Corners & Sides) ===== -->

  <!-- Short-term Memory -->
  <rect x="30" y="60" width="175" height="100" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="117" y="83" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Short-term</text>
  <text x="117" y="100" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Conversation Buffer</text>
  <line x1="45" y1="110" x2="190" y2="110" stroke="#30363D" stroke-width="1"/>
  <text x="117" y="127" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Last N messages</text>
  <text x="117" y="142" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Sliding window · FIFO</text>
  <text x="117" y="155" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="8">TTL: Session duration</text>

  <!-- Long-term Memory -->
  <rect x="595" y="60" width="175" height="100" rx="8" fill="#161B22" stroke="#6C3CE1" stroke-width="1.5"/>
  <text x="682" y="83" text-anchor="middle" fill="#6C3CE1" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Long-term</text>
  <text x="682" y="100" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Vector Store</text>
  <line x1="610" y1="110" x2="755" y2="110" stroke="#30363D" stroke-width="1"/>
  <text x="682" y="127" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Embedding index</text>
  <text x="682" y="142" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Persistent · FAISS / Qdrant</text>
  <text x="682" y="155" text-anchor="middle" fill="#6C3CE1" font-family="Arial,sans-serif" font-size="8">TTL: Permanent</text>

  <!-- Episodic Memory -->
  <rect x="30" y="430" width="175" height="100" rx="8" fill="#161B22" stroke="#F0883E" stroke-width="1.5"/>
  <text x="117" y="453" text-anchor="middle" fill="#F0883E" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Episodic</text>
  <text x="117" y="470" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Experience Store</text>
  <line x1="45" y1="480" x2="190" y2="480" stroke="#30363D" stroke-width="1"/>
  <text x="117" y="497" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Event sequences</text>
  <text x="117" y="512" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Temporal context · Scenarios</text>
  <text x="117" y="525" text-anchor="middle" fill="#F0883E" font-family="Arial,sans-serif" font-size="8">TTL: Time-decayed</text>

  <!-- Semantic Memory -->
  <rect x="595" y="430" width="175" height="100" rx="8" fill="#161B22" stroke="#3FB950" stroke-width="1.5"/>
  <text x="682" y="453" text-anchor="middle" fill="#3FB950" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Semantic</text>
  <text x="682" y="470" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Knowledge Graph</text>
  <line x1="610" y1="480" x2="755" y2="480" stroke="#30363D" stroke-width="1"/>
  <text x="682" y="497" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Facts · Concepts</text>
  <text x="682" y="512" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Relations · Ontologies</text>
  <text x="682" y="525" text-anchor="middle" fill="#3FB950" font-family="Arial,sans-serif" font-size="8">TTL: Permanent</text>

  <!-- ===== Arrows from Memory Types to Central Manager ===== -->

  <!-- Short-term to Manager -->
  <line x1="205" y1="110" x2="290" y2="230" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="175" fill="#8B949E" font-family="Arial,sans-serif" font-size="8" transform="rotate(50,230,175)">store / retrieve</text>

  <!-- Long-term to Manager -->
  <line x1="595" y1="110" x2="510" y2="230" stroke="#6C3CE1" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="570" y="175" fill="#8B949E" font-family="Arial,sans-serif" font-size="8" transform="rotate(-50,570,175)">store / retrieve</text>

  <!-- Episodic to Manager -->
  <line x1="205" y1="480" x2="290" y2="340" stroke="#F0883E" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="230" y="415" fill="#8B949E" font-family="Arial,sans-serif" font-size="8" transform="rotate(-50,230,415)">store / retrieve</text>

  <!-- Semantic to Manager -->
  <line x1="595" y1="480" x2="510" y2="340" stroke="#3FB950" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="415" fill="#8B949E" font-family="Arial,sans-serif" font-size="8" transform="rotate(50,570,415)">store / retrieve</text>

  <!-- ===== Central Memory Manager ===== -->
  <rect x="250" y="210" width="300" height="150" rx="12" fill="#161B22" stroke="#00B4FF" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="240" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="15" font-weight="bold">Memory Manager</text>

  <!-- Sub-components -->
  <rect x="270" y="255" width="120" height="35" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="330" y="277" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="10">Retrieval Engine</text>

  <rect x="410" y="255" width="120" height="35" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="470" y="277" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="10">Consolidation</text>

  <rect x="270" y="300" width="120" height="35" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="330" y="322" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="10">Decay Scheduler</text>

  <rect x="410" y="300" width="120" height="35" rx="5" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="470" y="322" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="10">Priority Queue</text>

  <!-- ===== Relevance Scoring Section ===== -->
  <rect x="230" y="385" width="340" height="75" rx="8" fill="#161B22" stroke="#6C3CE1" stroke-width="1.5"/>
  <text x="400" y="408" text-anchor="middle" fill="#6C3CE1" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Relevance Scoring Engine</text>
  <text x="400" y="428" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Cosine Similarity · BM25 · Recency Weight · Frequency</text>
  <text x="400" y="445" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Multi-signal fusion → Top-K selection → Context window</text>

  <!-- Arrow from Manager to Scoring -->
  <line x1="400" y1="360" x2="400" y2="385" stroke="#6C3CE1" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ===== AI Agent at Bottom ===== -->
  <rect x="280" y="560" width="240" height="60" rx="10" fill="#161B22" stroke="#00B4FF" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="587" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="14" font-weight="bold">AI Agent</text>
  <text x="400" y="607" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Context-Aware Reasoning</text>

  <!-- Arrow from Scoring to Agent -->
  <line x1="400" y1="460" x2="400" y2="560" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="515" fill="#8B949E" font-family="Arial,sans-serif" font-size="8">enriched context</text>

  <!-- Bidirectional arrow from Agent to Memory Manager (storing new memories) -->
  <line x1="340" y1="560" x2="340" y2="360" stroke="#6C3CE1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-purple)"/>
  <text x="320" y="470" fill="#8B949E" font-family="Arial,sans-serif" font-size="8" transform="rotate(-90,320,470)">store new memories</text>

  <!-- Feedback arrow from Scoring back to Memory types -->
  <line x1="230" y1="422" x2="117" y2="422" stroke="#8B949E" stroke-width="1" stroke-dasharray="4,3" opacity="0.4" marker-end="url(#arrow)"/>
  <line x1="570" y1="422" x2="682" y2="422" stroke="#8B949E" stroke-width="1" stroke-dasharray="4,3" opacity="0.4" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="30" y="565" width="180" height="70" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="45" y="583" fill="#8B949E" font-family="Arial,sans-serif" font-size="10" font-weight="bold">Memory Types:</text>
  <line x1="45" y1="595" x2="65" y2="595" stroke="#00B4FF" stroke-width="2"/>
  <text x="73" y="599" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Short-term</text>
  <line x1="120" y1="595" x2="140" y2="595" stroke="#6C3CE1" stroke-width="2"/>
  <text x="148" y="599" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Long-term</text>
  <line x1="45" y1="618" x2="65" y2="618" stroke="#F0883E" stroke-width="2"/>
  <text x="73" y="622" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Episodic</text>
  <line x1="120" y1="618" x2="140" y2="618" stroke="#3FB950" stroke-width="2"/>
  <text x="148" y="622" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Semantic</text>
</svg>