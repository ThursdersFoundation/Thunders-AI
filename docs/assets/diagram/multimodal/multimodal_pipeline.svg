<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00B4FF"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6C3CE1"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" fill="#0D1117" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="20" font-weight="bold">Multimodal AI Pipeline</text>

  <!-- ===== Input Branches (Row 1) ===== -->

  <!-- Text Input -->
  <rect x="50" y="60" width="180" height="55" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="140" y="85" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="13" font-weight="bold">📝 Text</text>
  <text x="140" y="103" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Natural Language Input</text>

  <!-- Image Input -->
  <rect x="310" y="60" width="180" height="55" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="400" y="85" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="13" font-weight="bold">🖼 Image</text>
  <text x="400" y="103" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Visual Data Input</text>

  <!-- Audio Input -->
  <rect x="570" y="60" width="180" height="55" rx="8" fill="#161B22" stroke="#00B4FF" stroke-width="1.5"/>
  <text x="660" y="85" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="13" font-weight="bold">🔊 Audio</text>
  <text x="660" y="103" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Sound Wave Input</text>

  <!-- Arrows from inputs to encoders -->
  <line x1="140" y1="115" x2="140" y2="155" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="115" x2="400" y2="155" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="660" y1="115" x2="660" y2="155" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Encoder Row ===== -->

  <!-- Text Encoder -->
  <rect x="40" y="165" width="200" height="70" rx="8" fill="#161B22" stroke="#6C3CE1" stroke-width="1.5"/>
  <text x="140" y="193" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Text Encoder</text>
  <text x="140" y="212" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">BERT / GPT Tokenizer</text>
  <text x="140" y="225" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">→ 768-dim Embedding</text>

  <!-- Image Encoder -->
  <rect x="290" y="165" width="220" height="70" rx="8" fill="#161B22" stroke="#6C3CE1" stroke-width="1.5"/>
  <text x="400" y="193" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Image Encoder</text>
  <text x="400" y="212" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">ViT / CLIP Vision</text>
  <text x="400" y="225" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">→ Patch Embeddings → 768-dim</text>

  <!-- Audio Encoder -->
  <rect x="550" y="165" width="220" height="70" rx="8" fill="#161B22" stroke="#6C3CE1" stroke-width="1.5"/>
  <text x="660" y="193" text-anchor="middle" fill="#E6EDF3" font-family="Arial,sans-serif" font-size="12" font-weight="bold">Audio Encoder</text>
  <text x="660" y="212" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Whisper / HuBERT</text>
  <text x="660" y="225" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">→ Mel-Spectrogram → 768-dim</text>

  <!-- Arrows from encoders converging to fusion -->
  <line x1="140" y1="235" x2="340" y2="310" stroke="#6C3CE1" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="400" y1="235" x2="400" y2="310" stroke="#6C3CE1" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="660" y1="235" x2="460" y2="310" stroke="#6C3CE1" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- ===== Fusion Layer ===== -->
  <rect x="250" y="315" width="300" height="70" rx="10" fill="#161B22" stroke="#6C3CE1" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="343" text-anchor="middle" fill="#6C3CE1" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Fusion Layer</text>
  <text x="400" y="362" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Cross-Modal Attention · Concatenation</text>
  <text x="400" y="376" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Gated Fusion · Co-Attention</text>

  <!-- Arrow from fusion to output -->
  <line x1="400" y1="385" x2="400" y2="430" stroke="#00B4FF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Unified Representation ===== -->
  <rect x="220" y="440" width="360" height="60" rx="10" fill="#161B22" stroke="#00B4FF" stroke-width="2" filter="url(#glow)"/>
  <text x="400" y="467" text-anchor="middle" fill="#00B4FF" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Unified Representation</text>
  <text x="400" y="487" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="10">Multi-modal Embedding · Joint Latent Space</text>

  <!-- Output arrows -->
  <rect x="60" y="520" width="120" height="20" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="120" y="534" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">VQA</text>

  <rect x="210" y="520" width="120" height="20" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="270" y="534" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Image Captioning</text>

  <rect x="360" y="520" width="120" height="20" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="420" y="534" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Audio-Visual QA</text>

  <rect x="510" y="520" width="120" height="20" rx="4" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <text x="570" y="534" text-anchor="middle" fill="#8B949E" font-family="Arial,sans-serif" font-size="9">Text-to-Image</text>

  <!-- Downstream task arrows -->
  <line x1="120" y1="500" x2="120" y2="520" stroke="#30363D" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="270" y1="500" x2="270" y2="520" stroke="#30363D" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="420" y1="500" x2="420" y2="520" stroke="#30363D" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="570" y1="500" x2="570" y2="520" stroke="#30363D" stroke-width="1" marker-end="url(#arrow)"/>
</svg>